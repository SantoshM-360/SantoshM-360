<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#1a1642"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="glyphAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#a78bfa" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <ellipse cx="980" cy="150" rx="280" ry="190" fill="url(#glow)">
    <animate attributeName="rx" values="260;300;260" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= left: identity ================= -->
  <text x="64" y="98" font-family="Consolas, 'JetBrains Mono', monospace" font-size="15"
        letter-spacing="3.5" fill="#a78bfa" opacity="0.85">
    AI/ML ENGINEER &#183; FULL-STACK DEVELOPER
  </text>

  <text x="62" y="160" font-family="Verdana, 'Segoe UI', sans-serif" font-size="46" font-weight="700">
    <tspan fill="#f4f2fb">SANTOSH SURESH</tspan>
  </text>
  <text x="62" y="210" font-family="Verdana, 'Segoe UI', sans-serif" font-size="46" font-weight="700">
    <tspan fill="url(#nameAccent)">MADANNAVAR</tspan>
  </text>

  <text x="64" y="244" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#c9c3e0" opacity="0.85">
    Turning data into deployed systems
  </text>

  <text x="64" y="275" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5"
        letter-spacing="1" fill="#8b83b0">
    CSE Graduate &#8212; 2026  &#183;  Open to SDE / Full-Stack / ML Engineer roles
  </text>

  <!-- ================= right: signature — three skill-threads weaving into code ================= -->
  <!-- thread colors: violet = ML, cyan = full-stack, pink = GenAI -->
  <g stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M745,60  C 800,60  815,110 838,116" stroke="#a78bfa"/>
    <path d="M745,150 C 800,150 815,140 838,140" stroke="#22d3ee"/>
    <path d="M745,240 C 800,240 815,180 838,168" stroke="#f472b6"/>
  </g>

  <g>
    <circle cx="745" cy="60"  r="4" fill="#a78bfa">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="150" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="240" r="4" fill="#f472b6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">
    <text x="600" y="64"  fill="#a78bfa" text-anchor="end">MACHINE LEARNING</text>
    <text x="600" y="154" fill="#22d3ee" text-anchor="end">FULL-STACK / WEB</text>
    <text x="600" y="244" fill="#f472b6" text-anchor="end">GENERATIVE AI</text>
  </g>

  <line x1="838" y1="116" x2="900" y2="149" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>
  <line x1="838" y1="140" x2="900" y2="149" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <line x1="838" y1="168" x2="900" y2="149" stroke="#f472b6" stroke-width="1.2" opacity="0.6"/>

  <circle cx="900" cy="149" r="5.5" fill="#c4b5fd">
    <animate attributeName="r" values="5.5;8;5.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- three colored pulses traveling their own thread into the merge point, staggered -->
  <circle r="3" fill="#a78bfa">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M745,60 C 800,60 815,110 838,116 L900,149 L950,149"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#22d3ee">
    <animateMotion dur="3.2s" begin="1.0s" repeatCount="indefinite" path="M745,150 C 800,150 815,140 838,140 L900,149 L950,149"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#f472b6">
    <animateMotion dur="3.2s" begin="2.0s" repeatCount="indefinite" path="M745,240 C 800,240 815,180 838,168 L900,149 L950,149"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- the threads resolve into code -->
  <text x="958" y="176" font-family="Consolas, 'JetBrains Mono', monospace" font-size="92"
        font-weight="700" fill="url(#glyphAccent)" filter="url(#softBlur)" letter-spacing="-2">
    &lt;/&gt;
  </text>
</svg>
